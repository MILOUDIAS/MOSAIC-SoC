# Recorded signoff waivers.
#
# A waiver here accepts a KNOWN defect at its MEASURED size, for ONE design,
# until a stated date. It is not an exemption: `accepted_max` is a ceiling, so
# a regression past the waived count fails the gate again. See
# harness/evidence/waivers.py for the rules enforced at load time, and
# docs/prompt_to_gds_path.md for why this one exists.
#
# Adding a waiver is a decision about silicon, not a way to make a run green.
# If you are tempted to add one to unblock yourself, close the violation instead.
#
# ---- TWO SLEW WAIVERS RETIRED 2026-08-16 -------------------------------------
# This file used to carry `design__max_slew_violation__count` waivers accepting
# 56 on mosaic_block_a and 49 on mosaic_block_c. Both are GONE, and not because
# the counts were argued down: the metric now reads ZERO on all three designs.
#
# They were never violations of anything the library objects to. max_transition
# is declared per input pin AND per corner in GF180 -- 4.0 ns at tt_025C_5v00,
# 7.0 ns at ss_125C_4v50, 2.6 ns at ff_n40C_5v50, 836 declarations per library
# file -- while MAX_TRANSITION_CONSTRAINT: 4 emitted
# `set_max_transition 4.0 [current_design]`, applying the TYPICAL corner's
# number at all nine. Every violation ever counted here was at an ss_125C_4v50
# corner, where the pins are rated to 7.0 ns:
#
#     shipped SDC        _56916_/ZN  limit 4.00  slew 5.664  -1.664  VIOLATED
#     library per-pin    _56916_/ZN  limit 7.00  slew 5.664  +1.34   MET
#
# The fix was NOT to drop the constraint. That was tried (runs/blocka_libtran)
# and is wrong: it is an optimisation target, so removing it costs 3.10% of
# cell area and the design then degrades past the LIBRARY's own limits --
# 7.1998 ns against a 7.0 ns pin rating, plus 5 max-capacitance violations
# against per-cell liberty limits. The area repair spends is what keeps the
# design qualified.
#
# The fix was to split PNR_SDC_FILE from SIGNOFF_SDC_FILE: PnR still targets
# 4.0 ns, signoff checks each pin against its own liberty limit. Measured, one
# differing config key in each case:
#
#     design          baseline run     netlist md5    max-slew   adverse
#     mosaic_block_a  blocka_slew32 -> blocka_sdc   IDENTICAL   56 -> 0   2 -> 1
#     mosaic_block_b  blockb_slew32 -> blockb_sdc   IDENTICAL   17 -> 0   2 -> 1
#     mosaic_block_c  blockc_ant8   -> blockc_sdc   IDENTICAL   49 -> 0   2 -> 1
#
# Byte-identical netlists and setup/hold slack equal to the last printed digit:
# the silicon did not change, only the number it is measured against. That is
# why this is a retirement and not a relaxation.
#
# It is also not a blinded gate. The same library-limit check CAUGHT the
# degraded blocka_libtran netlist (10 slew + 5 cap). It stopped reporting
# non-defects; it still reports defects.
#
# ---- WHY THE SAME ARGUMENT DOES NOT RETIRE THE FANOUT WAIVER -----------------
# Checked, rather than assumed by symmetry: the GF180 standard-cell libraries
# declare NO max_fanout at all -- zero occurrences, and no default_max_fanout,
# in every corner file. So MAX_FANOUT_CONSTRAINT: 10 has no library counterpart
# being overridden. There is no truer limit to defer to, and dropping it would
# remove the check rather than correct it. The violation below is a real
# violation of a rule this project chose, and it stays waived on its merits.

waivers:
  - metric: design__max_fanout_violation__count
    design: mosaic_block_a
    accepted_max: 5
    review_by: 2026-11-30
    recorded_by: MILOUDIAS
    evidence: flow/librelane/experimental/runs/blocka_padframe_def
    justification: >
      REWRITTEN 2026-08-27, second time. The count moved 4 -> 5 when the macro
      was re-hardened against the integrator's padframe DEF, and the previous
      record would have been WRONG rather than merely stale if the ceiling had
      simply been raised: it said every violation is "one of those roots at
      fanout 16", and the fifth is not.

      THE FIVE, identical at all nine corners (runs/blocka_padframe_def):

        clkbuf_0_clk_i_regs/Z                            16   -6
        clkbuf_0_...cpu_subsystem_i.cpu_0_0.clk_i/Z      16   -6
        clkbuf_0_...cpu_subsystem_i.cpu_1_0.clk_i/Z      16   -6
        clkbuf_0_...memory_subsystem_i.clk_cg/Z          16   -6
        _52521_/Z                                        11

      FOUR are the CTS pattern the previous record described: OpenROAD builds a
      16-way root buffer per gated-clock subtree, each at fanout 16 against
      MAX_FANOUT_CONSTRAINT 10. The membership shifted rather than grew --
      peripheral_subsystem_i.clk_cg left the list and clk_i_regs joined it --
      which is placement moving under a fixed pin assignment, not a new defect.

      THE FIFTH IS A DIFFERENT PHENOMENON and is recorded as such. `_52521_` is
      a buf_2 whose Z pin drives net _24458_ at fanout 11. Traced in the
      post-route netlist: it carries no clock (zero CLK/CP pins on the net), its
      eleven loads are ten buf_1 plus one antenna diode, and following the tree
      through reaches 100 nand3_1.A3 pins. Its source is a nand2_2, so this is
      combinational logic broadcast to 100 sinks, which the resizer buffered
      into a tree. The root of that tree sits one over the limit at 11.

      ITS MARGIN, measured on the signed-off database at ss_125C_4v50 rather
      than inferred from the zero counts (asked for in re-review):

        slew          0.494 ns   against the 4.0 ns PnR constraint, and
                                 against a 7.0 ns per-pin library limit at
                                 this corner: roughly 8x headroom
        capacitance   0.03 pF    total, of which WIRE capacitance is 0.00 --
                                 the load is eleven buffer inputs in a
                                 compact cluster, not a long net
        loads         11         ten buf_1 plus one antenna diode

      For scale, the design's worst slew pin at this corner is _44498_/ZN at
      2.97 ns against 4.00 (MET), so _52521_/Z is nowhere near the margin that
      matters. It appears in no corner's violator_list.rpt.

      WHY BOTH ARE ACCEPTED, on the same argument as before. MAX_FANOUT_CONSTRAINT
      10 is a rule this project chose; the GF180 standard-cell libraries declare
      no max_fanout and no default_max_fanout in any corner file, so no library
      limit is being exceeded. Fanout is a proxy for load, and what it proxies
      for is measured on this exact run and passes: max-slew 0 and
      max-capacitance 0 at ALL NINE corners, so none of the five appears in
      either violator list. Setup closes at +2.670 ns and hold at +0.069 ns with
      TNS 0. Post-route GLS on this netlist reaches EXIT SUCCESS in 12,399
      cycles, through a testbench that models the padring and reads the pad
      control values back out of the gates.

      WHY NOT FIXED. The levers were tried and measured on this design and every
      blanket one made it worse: CTS_MAX_CAP 0.15 took max-cap 27 -> 35 by
      concentrating load on these same gated-clock roots; bufz_8 on the QSPI
      pads took max-slew 591 -> 785; repair margins slew 45 + cap 40 took slew
      6 -> 43 and cap 2 -> 24 by inserting 1283 buffers, raising utilisation
      1.35 points and wirelength 6%. CTS_SINK_CLUSTERING_SIZE governs leaf
      clusters, not roots. None of these reach _52521_ either, which is a
      resizer artifact rather than a CTS one.

      RAISING THE CONSTRAINT ITSELF WAS TRIED, and it is the lever @tai08
      recommended in re-review: relax MAX_FANOUT_CONSTRAINT for clock nets
      rather than waive them. Measured as a single variable
      (runs/blocka_fanout16, 10 -> 16, CTS_SINK_CLUSTERING_SIZE held at 10,
      resolved configs differing by exactly one line):

        max-fanout violations      5  ->  12
        worst fanout              16  ->  21
        buffer cell area      31,137  ->  23,594 um2   (-24%)
        instances             73,158  ->  72,020       (-1.6%)
        wirelength         1,985,538  ->  1,920,673    (-3.3%)
        slew / cap / DRC / LVS / antenna    0, unchanged
        setup / hold WNS   +2.670/+0.069 -> +2.747/+0.071

      It made the count WORSE, and the violator identities say why. At 10 the
      five are ROOT buffers, clkbuf_0_*, at fanout 16. At 16 they are
      clkbuf_3_* and clkbuf_4_*, three and four levels DOWN the tree, carrying
      17 to 21 sinks each. Telling CTS that 16 sinks per buffer is acceptable
      buys a shallower tree with 24% less buffer area, and that tree then
      overshoots its own relaxed limit in twelve places.

      So the constraint is doing work rather than merely reporting. This is the
      same result the MAX_TRANSITION experiment produced, now measured directly
      on the constraint in question instead of argued by analogy.

      NOT ARGUED HERE: that blocka_fanout16 is a bad design. It is clean on
      every other check and marginally better on timing and wirelength. The
      claim is narrower. Five root buffers at a known fanout with measured slew
      and capacitance margin is a smaller and better understood thing to accept
      than twelve mid-tree buffers at up to 21.

      NOT waived by this record: a sixth violating net, since accepted_max is a
      ceiling; any of these five appearing in the max-slew or max-capacitance
      lists, which is the condition the whole argument rests on; any other
      design; and any DRC, LVS, XOR, antenna, power-grid or timing finding, all
      of which are zero on runs/blocka_padframe_def and have no waiver behind
      them.

      SUPERSEDED EVIDENCE. The previous record cited runs/blocka_1110_ndr at
      accepted_max 4. That run remains valid for what it measured, but it is the
      22-port macro, not the 167-terminal one being submitted, so it no longer
      describes the delivered design.

# ---- ON THE SUBMITTED DIE ----------------------------------------------------
# THE SUBMITTED DESIGN IS NOW 1110 x 1110 um AT 20 MHz (runs/blocka_1110_ndr).
# 1110 is a MANDATE: @d-m-bailey reported that the A block's maximum is
# 1110 x 1110 and that our 1117.5 um PR boundary exceeded it, which is why the
# padframe generator fell back to the next valid block size. Everything above is
# measured on the smaller die.
#
# 20 MHz rather than 25 is a measured choice, not a retreat. On this die 25 MHz
# also closes with every check clean (runs/blocka_1110_25_ndr) but at +0.089 ns
# of setup, 0.22% of the period. For scale, changes made during this work moved
# setup by 0.245 ns and 0.693 ns, and a wrapper rewrite to drive the pad control
# terminals is still ahead. 20 MHz holds +6.066 ns, 12.13%.
#
# The GDS that was actually taped out (runs/blocka_signoff) predates every flow
# fix in this file's history, AND is on the oversized 1117.5 um die. Checked against the CURRENT configuration it
# would report 591 max-slew violations -- against the old blanket 4.0 ns limit,
# so most of those were the same non-defects retired above, but it also predates
# the post-GRT repair fix and the antenna iteration fix, which were real. It is
# not re-measured here and no waiver covers it.
#
# NO WAIVER IS RECORDED FOR mosaic_block_b OR FOR mosaic_block_c's max-fanout.
# Block B measures 1 violating net and Block C measures 4, both unwaived and
# both therefore reported as adverse. That is deliberate: neither design is
# being submitted, and a waiver for a design nobody is taping out would be
# ceremony that makes a dashboard green. Record one if either is ever
# submitted, with its own measurement.
