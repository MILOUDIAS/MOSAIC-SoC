# ======================================================
# Project metadata (used for documentation / review)
# ======================================================
project:
  title: "MOSAIC-SoC"
  team: "JustVibeAndTapeout"
  discord: "MILOUDIAS, kewenlee, yassinehk"
  description: "Config-to-GDSII generator for heterogeneous multi-core RISC-V SoCs, driven by an LLM agent, targeting the GF180MCU open PDK"
  lvs_config: "lvs_config.json"
  gf_def_ready: true # data ready for def generation with global foundries' pad frame
  ws_def_ready: true # data ready for def generation with wafer space pad frame
  drc_ready: true # data ready for integration and DRC
  lvs_ready: true # data ready for integrated LVS
  export_control: "docs/Export_Control_GF_MOSAIC_BlockA.docx" # Required export control document
# There are 7 i/o pin types and the associated connections from the user area to the i/o pad cell
# all control signals must be connected
# ground:
#   <name> connects to DVSS
# power:
#   <name> connects to DVDD
# input_cmos: digital input with no hysteresis
#   <name> connects to Y
#   control pins:
#     <name_PD>: connects to PD. weak pull down when enabled
#     <name_PU>: connects to PU. weak pull up when enabled
# input_schmitt: digital input with hysteresis
#   <name> connects to Y
#   control pins:
#     <name_PD>: connects to PD. weak pull down when enabled
#     <name_PU>: connects to PU. weak pull up when enabled
# bidirectional: programmable drive strength PDRV[1:0] - 00: 4mA, 01: 8mA, 10: 12mA, 11: 16mA
#   <name>_IN connects to Y
#   <name>_OUT connects to A
#   control pins:
#     <name_PD>: connects to PD. weak pull down when enabled
#     <name_PU>: connects to PU. weak pull up when enabled
#     <name_CS>: input type - low is cmos buffer, high is schmitt trigger
#     <name_SL>: output slew rate - low is fast, high is slow
#     <name_IE>: input enable - high for input PAD -> Y
#     <name_OE>: output enable - high for output A -> PAD
#     <name_PDRV0>: drive strength lsb
#     <name_PDRV1>: drive strength msb
# bidirectional_24ma: fixed drive strength 24mA
#   <name>_IN connects to Y
#   <name>_OUT connects to A
#   control pins:
#     <name_PD>: connects to PD. weak pull down when enabled
#     <name_PU>: connects to PU. weak pull up when enabled
#     <name_CS>: input type - low is cmos buffer, high is schmitt trigger
#     <name_SL>: output slew rate - low is fast, high is slow
#     <name_IE>: input enable - high for input PAD -> Y
#     <name_OE>: output enable - high for output A -> PAD
# analog:
#   <name> connects to ASIG5V
#   Note: secondary_esd flag is ignored

pins:
  - name: VSS
    io_type: ground # note: due to a common ground connection, ground pads are generally not needed.
  - name: clk_i #clock
    io_type: input_schmitt
  - name: rst_ni #reset, active low
    io_type: input_cmos
  - name: boot_select_i #boot source select
    io_type: input_cmos
  - name: execute_from_flash_i #XIP enable
    io_type: input_cmos
  - name: uart_rx_i # UART receive
    io_type: input_cmos
  - name: uart_tx_o # UART transmit
    io_type: bidirectional
  - name: spi_flash_sck_o # QSPI clock
    io_type: bidirectional
  - name: spi_flash_cs_o # QSPI chip select
    io_type: bidirectional
  - name: spi_flash_sd_io[0] # QSPI data 0 (true tristate, bufz_4)
    io_type: bidirectional
  - name: spi_flash_sd_io[1] # QSPI data 1 (true tristate, bufz_4)
    io_type: bidirectional
  - name: spi_flash_sd_io[2] # QSPI data 2 (true tristate, bufz_4)
    io_type: bidirectional
  - name: spi_flash_sd_io[3] # QSPI data 3 (true tristate, bufz_4)
    io_type: bidirectional
  - name: status_valid_o # exit-value strobe
    io_type: bidirectional
  - name: status_o[0] # status 0 observability pin
    io_type: bidirectional
  - name: status_o[1] # status 1 observability pin
    io_type: bidirectional
  - name: status_o[2]
    io_type: bidirectional
  - name: status_o[3]
    io_type: bidirectional
  - name: status_o[4]
    io_type: bidirectional
  - name: status_o[5]
    io_type: bidirectional
  - name: status_o[6]
    io_type: bidirectional
  - name: VDD
    io_type: power
